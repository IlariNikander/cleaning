<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siivouspisteet</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #dfe5ee;
      --accent: #3157d5;
      --accent-soft: rgba(49,87,213,.12);
      --shadow: 0 12px 34px rgba(31,46,87,.08);
      --ok: #177245;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(780px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -.04em;
      line-height: 1;
    }

    .scoreboard,
    .task-card {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .scoreboard {
      position: sticky;
      top: 12px;
      z-index: 10;
      margin-bottom: 12px;
      padding: 18px 20px;
    }

    .score-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding: 7px 0;
    }

    .score-row + .score-row {
      border-top: 1px solid var(--border);
    }

    .person {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .points {
      font-size: 1.65rem;
      font-weight: 900;
    }

    .sync {
      min-height: 1.3em;
      margin: 0 3px 15px;
      color: var(--muted);
      font-size: .84rem;
    }

    .sync.ok { color: var(--ok); }
    .sync.error { color: var(--error); }

    .task-list {
      display: grid;
      gap: 13px;
    }

    .task-card {
      padding: 17px;
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 15px;
    }

    .task-name {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.35;
      font-weight: 800;
    }

    .task-points {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 850;
      white-space: nowrap;
    }

    .counter-row {
      display: grid;
      grid-template-columns: 34px 44px 60px 44px 1fr;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
    }

    .counter-row + .counter-row {
      border-top: 1px solid var(--border);
    }

    .counter-person {
      font-weight: 900;
      font-size: 1.08rem;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .counter-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: transparent;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .counter-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .count {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .subtotal {
      text-align: right;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .bottom-toolbar {
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }

    .reset-all {
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--muted);
      background: var(--card);
      font-weight: 800;
    }

    .reset-all:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--text);
    }

    @media (max-width: 520px) {
      .counter-row {
        grid-template-columns: 28px 42px 48px 42px 1fr;
        gap: 6px;
      }

      .counter-btn {
        width: 42px;
        height: 42px;
      }

      .subtotal {
        font-size: .82rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Siivouspisteet</h1>

    <section class="scoreboard" aria-label="Pistetilanne">
      <div class="score-row">
        <span class="person">K</span>
        <span class="points" id="scoreK">0</span>
      </div>
      <div class="score-row">
        <span class="person">I</span>
        <span class="points" id="scoreI">0</span>
      </div>
    </section>

    <div id="syncStatus" class="sync">Yhdistetään…</div>

    <section class="task-list" id="taskList"></section>

    <div class="bottom-toolbar">
      <button class="reset-all" id="resetAll" type="button">Tyhjennä kaikki</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCqeww4HeFZioI04UA9ShZBKYp47r5Kp4U",
      authDomain: "croisantinrepija-c0878.firebaseapp.com",
      projectId: "croisantinrepija-c0878",
      storageBucket: "croisantinrepija-c0878.firebasestorage.app",
      messagingSenderId: "997353427368",
      appId: "1:997353427368:web:087003202c24df08be4d9d",
      measurementId: "G-RPZPPBGS7N"
    };

    const chores = [
      { id: "ylakerta-lattiat", name: "Yläkerran imurointi ja lattioiden tyhjennys", points: 4 },
      { id: "alakerta-lattiat", name: "Alakerran imurointi ja lattioiden tyhjennys", points: 4 },
      { id: "ylakerran-vessa", name: "Yläkerran vessan pesu", points: 2 },
      { id: "alakerran-vessa", name: "Alakerran vessan pesu", points: 2 },
      { id: "tiskikone-taytto", name: "Tiskikoneen täyttö", points: 1 },
      { id: "tiskikone-tyhjennys", name: "Tiskikoneen tyhjennys", points: 1 },
      { id: "pyykinpesukone-taytto", name: "Pyykinpesukoneen täyttö", points: 1 },
      { id: "pyykinpesukone-tyhjennys", name: "Pyykinpesukoneen tyhjennys", points: 1 },
      { id: "pyykkien-viikkaus", name: "Pyykkien viikkaus", points: 1 },
      { id: "kylpyhuone", name: "Kylpyhuoneen pesu", points: 8 },
      { id: "kierratykset", name: "Kierrätysten vienti", points: 2 }
    ];

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const stateRef = doc(db, "cleaning", "current");

    const taskList = document.querySelector("#taskList");
    const scoreK = document.querySelector("#scoreK");
    const scoreI = document.querySelector("#scoreI");
    const syncStatus = document.querySelector("#syncStatus");
    const resetAll = document.querySelector("#resetAll");

    let counts = {};
    let ready = false;

    function setStatus(text, type = "") {
      syncStatus.textContent = text;
      syncStatus.className = `sync ${type}`.trim();
    }

    function getCount(taskId, person) {
      const task = counts[taskId];
      if (!task || typeof task !== "object") return 0;

      const value = Number(task[person]);
      return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
    }

    async function changeCount(taskId, person, delta) {
      if (!ready) return;

      setStatus("Tallennetaan…");

      try {
        await runTransaction(db, async transaction => {
          const snapshot = await transaction.get(stateRef);
          const data = snapshot.exists() ? snapshot.data() : {};
          const currentCounts =
            data.counts && typeof data.counts === "object"
              ? structuredClone(data.counts)
              : {};

          const taskCounts =
            currentCounts[taskId] && typeof currentCounts[taskId] === "object"
              ? { ...currentCounts[taskId] }
              : { K: 0, I: 0 };

          const current = Number(taskCounts[person]) || 0;
          taskCounts[person] = Math.max(0, current + delta);

          if ((Number(taskCounts.K) || 0) === 0 && (Number(taskCounts.I) || 0) === 0) {
            delete currentCounts[taskId];
          } else {
            currentCounts[taskId] = taskCounts;
          }

          transaction.set(
            stateRef,
            { counts: currentCounts },
            { merge: true }
          );
        });

        setStatus("Synkronoitu", "ok");
      } catch (error) {
        console.error(error);
        setStatus("Tallennus epäonnistui.", "error");
      }
    }

    function render() {
      taskList.replaceChildren();

      let totalK = 0;
      let totalI = 0;

      chores.forEach(chore => {
        const kCount = getCount(chore.id, "K");
        const iCount = getCount(chore.id, "I");

        totalK += kCount * chore.points;
        totalI += iCount * chore.points;

        const card = document.createElement("article");
        card.className = "task-card";

        const top = document.createElement("div");
        top.className = "task-top";

        const name = document.createElement("h2");
        name.className = "task-name";
        name.textContent = chore.name;

        const points = document.createElement("span");
        points.className = "task-points";
        points.textContent = `${chore.points} p / kerta`;

        top.append(name, points);
        card.append(top);

        ["K", "I"].forEach(person => {
          const count = person === "K" ? kCount : iCount;

          const row = document.createElement("div");
          row.className = "counter-row";

          const label = document.createElement("span");
          label.className = "counter-person";
          label.textContent = person;

          const minus = document.createElement("button");
          minus.type = "button";
          minus.className = "counter-btn";
          minus.textContent = "−";
          minus.disabled = !ready || count === 0;
          minus.setAttribute("aria-label", `${person}: vähennä yksi`);
          minus.addEventListener("click", () => changeCount(chore.id, person, -1));

          const countEl = document.createElement("span");
          countEl.className = "count";
          countEl.textContent = count;

          const plus = document.createElement("button");
          plus.type = "button";
          plus.className = "counter-btn";
          plus.textContent = "+";
          plus.disabled = !ready;
          plus.setAttribute("aria-label", `${person}: lisää yksi`);
          plus.addEventListener("click", () => changeCount(chore.id, person, 1));

          const subtotal = document.createElement("span");
          subtotal.className = "subtotal";
          subtotal.textContent = `${count * chore.points} p`;

          row.append(label, minus, countEl, plus, subtotal);
          card.append(row);
        });

        taskList.append(card);
      });

      scoreK.textContent = totalK;
      scoreI.textContent = totalI;
      resetAll.disabled = !ready || Object.keys(counts).length === 0;
    }

    resetAll.addEventListener("click", async () => {
      if (!window.confirm("Haluatko varmasti tyhjentää kaikki?")) return;

      setStatus("Tyhjennetään…");

      try {
        await setDoc(
          stateRef,
          { counts: {} },
          { merge: true }
        );
        setStatus("Synkronoitu", "ok");
      } catch (error) {
        console.error(error);
        setStatus("Tyhjennys epäonnistui.", "error");
      }
    });

    render();

    onSnapshot(
      stateRef,
      async snapshot => {
        if (!snapshot.exists()) {
          try {
            await setDoc(stateRef, { counts: {} });
          } catch (error) {
            console.error(error);
            ready = false;
            render();
            setStatus("Tietokantaa ei voitu alustaa.", "error");
            return;
          }
        } else {
          const data = snapshot.data();
          counts =
            data.counts && typeof data.counts === "object"
              ? data.counts
              : {};
        }

        ready = true;
        render();
        setStatus("Synkronoitu", "ok");
      },
      error => {
        console.error(error);
        ready = false;
        render();
        setStatus("Yhteys Firestoreen epäonnistui.", "error");
      }
    );
  </script>
</body>
</html>
